# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - camp-freedive-ph

on:
  push:
    branches:
      - feature/prd-forecast
  workflow_dispatch:

# Never run two production deploys at once; a newer push waits for the running one
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # The full test suite (PostgreSQL, like production) must pass before anything is built or deployed
  test:
    uses: ./.github/workflows/laravel.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'camp-freedive-ph/composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        working-directory: camp-freedive-ph
        run: composer validate --no-check-publish && composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: camp-freedive-ph/package-lock.json

      - name: Build frontend
        working-directory: camp-freedive-ph
        run: |
          npm ci
          npm run build

      # Only camp-freedive-ph/ is deployed, so bundle the ML demand thresholds inside it
      - name: Bundle demand thresholds
        run: |
          mkdir -p camp-freedive-ph/resources/ml
          cp demand-forecast/demand_thresholds.json camp-freedive-ph/resources/ml/demand_thresholds.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: camp-freedive-ph
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9AB5691033E040ED87802B00A7809DEB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B790FB2DFCE64151B5FA9AE0CE98283E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9B0A35A5E607454B867935AF9FB005C9 }}

      # Azure restarts the app if /up stops answering. continue-on-error: a missing permission must not block the deploy.
      - name: Turn on Health Check
        continue-on-error: true
        run: |
          az webapp config set -g rg-capstone-prod -n camp-freedive-ph --generic-configurations '{"healthCheckPath": "/up"}' --query healthCheckPath -o tsv

      # Prints only non-secret settings, as annotations (the repo is public, so never print keys or passwords here)
      - name: Report production app settings
        continue-on-error: true
        run: |
          az webapp config appsettings list -g rg-capstone-prod -n camp-freedive-ph \
            --query "[?name=='APP_ENV' || name=='APP_DEBUG' || name=='MAIL_MAILER' || name=='LOG_LEVEL' || name=='QUEUE_CONNECTION' || name=='DB_CONNECTION' || name=='SESSION_DRIVER' || name=='SESSION_SECURE_COOKIE'].[name, value]" -o tsv > settings.tsv
          [ -s settings.tsv ] || echo "None of these keys are set in App Settings" > settings.tsv
          echo "::notice title=Production app settings::$(tr '\t\n' '= ' < settings.tsv)"

      # The PayMongo webhook rejects every event when its signing secret is missing, so do not deploy
      # without it. Only the setting NAME is read; the value is never fetched or printed.
      - name: Require the PayMongo webhook secret
        run: |
          if ! names=$(az webapp config appsettings list -g rg-capstone-prod -n camp-freedive-ph --query "[].name" -o tsv); then
            echo "::warning title=Webhook secret not verified::Could not list app setting names; check PAYMONGO_WEBHOOK_SIGNATURE_SECRET manually."
            exit 0
          fi
          if ! echo "$names" | grep -qx 'PAYMONGO_WEBHOOK_SIGNATURE_SECRET'; then
            echo "::error title=Missing app setting::PAYMONGO_WEBHOOK_SIGNATURE_SECRET is not set; PayMongo webhooks would be rejected. Deploy stopped."
            exit 1
          fi
          echo "PAYMONGO_WEBHOOK_SIGNATURE_SECRET is set (value not read)."

      # The startup command installs our nginx config, runs pending migrations, then starts Laravel's scheduler
      # (routes/console.php: forecast refresh, hourly batch safety checks, nightly accuracy archive) and a queue worker
      # (queued mail). Both run in restart loops, and the worker exits hourly (--max-time) to pick up new code. Needs "Always On".
      # Fails closed: if the config can't be copied or doesn't pass `nginx -t`, nginx is stopped, because Azure's stock
      # config serves /home/site/wwwroot (including .env) instead of public/.
      # Migration and optimize output, plus any "STARTUP ERROR" line, go to /home/LogFiles/laravel-startup.log instead of
      # being discarded. A failed migration is not hidden: /up answers 500 while any migration is pending, which fails the
      # health wait in the next step (and Azure's health check), so the run goes red. Rollback: re-run the last good deploy.
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'camp-freedive-ph'
          slot-name: 'Production'
          package: .
          startup-command: 'if cp /home/site/wwwroot/deploy/nginx/default.conf /etc/nginx/sites-available/default && nginx -t; then service nginx reload; else echo "nginx config not applied, stopping nginx" >&2; service nginx stop; fi; { echo "$(date -u +%FT%TZ) startup: migrate"; php /home/site/wwwroot/artisan migrate --force --no-interaction || echo "$(date -u +%FT%TZ) STARTUP ERROR: migrate failed (exit $?)"; php /home/site/wwwroot/artisan optimize || echo "$(date -u +%FT%TZ) STARTUP ERROR: optimize failed (exit $?)"; } >> /home/LogFiles/laravel-startup.log 2>&1; (nohup sh -c "while true; do php /home/site/wwwroot/artisan schedule:work; sleep 5; done" >> /home/LogFiles/laravel-scheduler.log 2>&1 &); (nohup sh -c "while true; do php /home/site/wwwroot/artisan queue:work --tries=3 --max-time=3600; sleep 5; done" >> /home/LogFiles/laravel-queue.log 2>&1 &)'

      # Waits until the restarted app answers /up with 200 under the new config (nginx adds the headers to its own 502s
      # too, so the status matters), then fails the run if a private file is reachable. The restart takes about 2 minutes.
      # If /up never answers 200 (pending/failed migration, or the app does not boot), the run FAILS here instead of
      # passing silently. Rollback: Actions > last successful run of this workflow > "Re-run all jobs".
      - name: Check that the app is healthy and private files are not served
        env:
          SITE_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          healthy=0
          for i in $(seq 1 40); do
            h=$(curl -sI -m 15 "$SITE_URL/up" || true)
            if echo "$h" | head -1 | grep -q ' 200' && echo "$h" | grep -qi '^x-content-type-options: nosniff'; then healthy=1; break; fi
            sleep 15
          done
          if [ "$healthy" != 1 ]; then
            echo "::error title=App not healthy after deploy::/up did not answer 200 within 10 minutes (last status: $(echo "$h" | head -1 | tr -d '\r')). Likely a failed or pending migration or a startup error: see /home/LogFiles/laravel-startup.log. Roll back by re-running the last successful deploy."
            exit 1
          fi
          fail=0
          for p in /.env /.htaccess /.git/config /composer.json /artisan /storage/logs/laravel.log; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$p")
            echo "$p -> $code"
            [ "$code" = "200" ] && fail=1
          done
          curl -sI "$SITE_URL/" | grep -qi '^x-content-type-options: nosniff' || { echo "Security headers missing: nginx config not applied"; fail=1; }
          exit $fail
          