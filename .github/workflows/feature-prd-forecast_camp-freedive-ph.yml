# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - camp-freedive-ph

on:
  push:
    branches:
      - feature/prd-forecast
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'camp-freedive-ph/composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        working-directory: camp-freedive-ph
        run: composer validate --no-check-publish && composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: camp-freedive-ph/package-lock.json

      - name: Build frontend
        working-directory: camp-freedive-ph
        run: |
          npm ci
          npm run build

      # Only camp-freedive-ph/ is deployed, so bundle the ML demand thresholds inside it
      - name: Bundle demand thresholds
        run: |
          mkdir -p camp-freedive-ph/resources/ml
          cp demand-forecast/demand_thresholds.json camp-freedive-ph/resources/ml/demand_thresholds.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: camp-freedive-ph
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9AB5691033E040ED87802B00A7809DEB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B790FB2DFCE64151B5FA9AE0CE98283E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9B0A35A5E607454B867935AF9FB005C9 }}

      # The startup command installs our nginx config, runs pending migrations, then starts Laravel's scheduler
      # (routes/console.php: forecast refresh, hourly batch safety checks, nightly accuracy archive). Needs "Always On" in Azure.
      # Fails closed: if the config can't be copied or doesn't pass `nginx -t`, nginx is stopped, because Azure's stock
      # config serves /home/site/wwwroot (including .env) instead of public/.
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'camp-freedive-ph'
          slot-name: 'Production'
          package: .
          startup-command: 'if cp /home/site/wwwroot/deploy/nginx/default.conf /etc/nginx/sites-available/default && nginx -t; then service nginx reload; else echo "nginx config not applied, stopping nginx" >&2; service nginx stop; fi; (php /home/site/wwwroot/artisan migrate --force || true) && (php /home/site/wwwroot/artisan optimize || true); (nohup php /home/site/wwwroot/artisan schedule:work >> /home/LogFiles/laravel-scheduler.log 2>&1 &)'

      # Waits for the restarted site, then fails the run if a private file is reachable or the nginx config is missing
      - name: Check that private files are not served
        env:
          SITE_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/up")" = "200" ] && break
            sleep 10
          done
          fail=0
          for p in /.env /.htaccess /.git/config /composer.json /artisan /storage/logs/laravel.log; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$p")
            echo "$p -> $code"
            [ "$code" = "200" ] && fail=1
          done
          curl -sI "$SITE_URL/" | grep -qi '^x-content-type-options: nosniff' || { echo "Security headers missing: nginx config not applied"; fail=1; }
          exit $fail
          