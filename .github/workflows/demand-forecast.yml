name: Retrain and sync demand forecast

on:
  schedule:
    # 02:00 Asia/Manila (UTC+8) every day.
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: demand-forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: demand-forecast/requirements.txt

      - name: Install demand forecast dependencies
        working-directory: demand-forecast
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Retrain and sync forecast
        working-directory: demand-forecast
        env:
          ML_TOKEN: ${{ secrets.ML_API_TOKEN }}
          LARAVEL_API_URL: https://camp-freedive-ph-bedpaseahaafbzhw.eastasia-01.azurewebsites.net/api/v1/ml
          INCLUDE_LARAVEL_BATCHES: '1'
        run: python retrain_pipeline.py --include-laravel
